<svg width="800" height="160" viewBox="0 0 800 160" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .spark { animation: twinkle 2.5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- floating sparkles / particles -->
  <g fill="#F75C7E">
    <circle class="spark" cx="60" cy="30" r="3">
      <animate attributeName="cy" values="30;15;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle class="spark" cx="740" cy="40" r="2.5" fill="#6A5ACD">
      <animate attributeName="cy" values="40;20;40" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="400" cy="20" r="2" fill="#F9C74F">
      <animate attributeName="cy" values="20;5;20" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating tech icons, each with its own bob rhythm -->
  <g>
    <image href="https://skillicons.dev/icons?i=js" x="40" y="70" width="48" height="48">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="3.2s" repeatCount="indefinite"/>
    </image>

    <image href="https://skillicons.dev/icons?i=react" x="160" y="60" width="52" height="52">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-18; 0,0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/>
    </image>

    <image href="https://skillicons.dev/icons?i=nodejs" x="290" y="75" width="46" height="46">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="3.6s" begin="0.8s" repeatCount="indefinite"/>
    </image>

    <image href="https://skillicons.dev/icons?i=mongodb" x="410" y="62" width="50" height="50">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-16; 0,0" dur="2.9s" begin="1.1s" repeatCount="indefinite"/>
    </image>

    <image href="https://skillicons.dev/icons?i=express" x="530" y="72" width="48" height="48">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-13; 0,0" dur="3.4s" begin="0.2s" repeatCount="indefinite"/>
    </image>

    <image href="https://skillicons.dev/icons?i=git" x="650" y="64" width="48" height="48">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-17; 0,0" dur="2.7s" begin="0.6s" repeatCount="indefinite"/>
    </image>
  </g>
</svg>
